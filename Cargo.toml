[package]
name = "ztype"
version = "0.2.1"
edition = "2024"
rust-version = "1.100"
description = "A Project Z multilingual composition app powered by zinput"
license = "MIT"
repository = "https://github.com/LIghtJUNction/ztype"
readme = "README.md"
publish = false

[features]
default = ["desktop", "gui", "plugins", "wayland-popup"]
desktop = ["dep:zuse"]
gui = ["desktop", "dep:zgpui"]
plugins = ["zinput/plugins", "dep:zplugin"]
wayland = ["dep:zinput-wayland"]
candidate-ui = ["dep:zgpui-raster"]
wayland-popup = ["wayland", "candidate-ui"]

[dependencies]
zinput = { version = "=0.1.3", default-features = false }
zuse = { package = "zuse-computer", version = "=0.2.2", optional = true }
zgpui = { path = "vendor/zgpui", version = "=0.1.5", features = ["native"], optional = true }
zplugin = { version = "=0.3.1", default-features = false, features = ["std"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
zgpui-raster = { path = "vendor/zgpui/raster", version = "=0.1.0", optional = true }
zinput-wayland = { path = "vendor/zinput/native/wayland", version = "=0.1.0", optional = true }

[[example]]
name = "kana_plugin"
path = "examples/kana_plugin.rs"
crate-type = ["cdylib"]
required-features = ["plugins"]

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
